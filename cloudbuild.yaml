steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f
      - docker/Dockerfile
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 2400s
substitutions:
  _IMAGE: asia-east1-docker.pkg.dev/dailystock-analysis/dsa/dsa-api:latest
