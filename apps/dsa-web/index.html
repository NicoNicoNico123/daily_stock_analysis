<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const storageKey = 'theme';
        const root = document.documentElement;
        const storedTheme = localStorage.getItem(storageKey);
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark';
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
    // Accent identity (aurora default) — applied before first paint to avoid a flash.
    try {
      const storedAccent = localStorage.getItem('dsa.accent');
      root.dataset.accent = storedAccent === 'obsidian' || storedAccent === 'amber' ? storedAccent : 'aurora';
    } catch (e) {
      root.dataset.accent = 'aurora';
    }
      })();
    </script>
    <title>DSA 股票智能分析</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
